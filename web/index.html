<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>SNN-3Comp-FPT (Go)</title>
    <style>
        body { font-family: system-ui, sans-serif; margin:0; }
        #root { display:flex; height: 100vh; }
        #left { width: 40%; border-right:1px solid #ddd; padding:12px; overflow:auto; }
        #right { flex:1; padding:12px; }
        .logline { font-family: ui-monospace, Menlo, monospace; font-size:12px; margin:0; }
        #chart { width:100%; height:400px; border:1px solid #eee; }
        .badge { display:inline-block; padding:2px 6px; border-radius:4px; background:#f0f0f0; margin-right:6px; }
    </style>
</head>
<body>
<div id="root">
    <div id="left">
        <h3>训练日志</h3>
        <div id="status">
            <span class="badge" id="lastLoss">loss: -</span>
            <span class="badge" id="lastAcc">acc: -</span>
            <span class="badge" id="epoch">epoch: -</span>
        </div>
        <div id="logs"></div>
    </div>
    <div id="right">
        <h3>训练曲线（Loss / Acc）</h3>
        <canvas id="chart"></canvas>
    </div>
</div>
<script>
    const logs = document.getElementById('logs');
    const ctx = document.getElementById('chart').getContext('2d');
    const W = ()=>ctx.canvas.width  = document.getElementById('right').clientWidth - 24;
    const H = ()=>ctx.canvas.height = 400; W(); H(); window.onresize = ()=>{W();H();draw()};
    const lossData=[], accData=[];
    function draw(){
        ctx.clearRect(0,0,ctx.canvas.width, ctx.canvas.height);
        // 坐标
        ctx.strokeRect(40,10,ctx.canvas.width-60,ctx.canvas.height-40);
        const plotW = ctx.canvas.width-60, plotH = ctx.canvas.height-40;
        const maxLoss = Math.max(1e-6, ...lossData.map(d=>d.y));
        const maxAcc = 1.0;
        // loss 曲线（左 y）
        ctx.beginPath();
        lossData.forEach((d,i)=>{
            const x = 40 + plotW * (i/Math.max(1,lossData.length-1));
            const y = 10 + plotH * (1 - d.y/maxLoss);
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
        // acc 曲线（右 y）
        ctx.beginPath();
        accData.forEach((d,i)=>{
            const x = 40 + plotW * (i/Math.max(1,accData.length-1));
            const y = 10 + plotH * (1 - d.y/maxAcc);
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
    }
    function addLog(text){
        const p=document.createElement('p'); p.className='logline'; p.textContent = text;
        logs.appendChild(p); logs.scrollTop = logs.scrollHeight;
    }
    const es = new EventSource('/events');
    es.addEventListener('metrics_batch', ev=>{
        const o = JSON.parse(ev.data);
        document.getElementById('lastLoss').textContent = 'loss: ' + o.loss.toFixed(4);
        document.getElementById('lastAcc').textContent  = 'acc: '  + o.acc.toFixed(4);
        document.getElementById('epoch').textContent    = 'epoch: ' + o.epoch;
        lossData.push({x:o.step, y:o.loss}); accData.push({x:o.step, y:o.acc}); draw();
    });
    es.addEventListener('metrics_epoch', ev=>{
        const o = JSON.parse(ev.data);
        addLog(`[EPOCH] epoch=${o.epoch} loss=${o.loss.toFixed(4)} acc=${o.acc.toFixed(4)}`);
    });
    es.addEventListener('log', ev=>{
        const o = JSON.parse(ev.data);
        addLog(o.msg);
    });
</script>
</body>
</html>
